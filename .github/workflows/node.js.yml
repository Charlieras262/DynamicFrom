# Builds the library and runs its spec suite on every push and pull request to master.
# For more information see: https://docs.github.com/actions/use-cases-and-examples/building-and-testing/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Angular 11 uses webpack 4 (md4 hashes) for the Karma build; Node >= 17 needs the legacy OpenSSL provider.
      NODE_OPTIONS: --openssl-legacy-provider

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run test:lib
