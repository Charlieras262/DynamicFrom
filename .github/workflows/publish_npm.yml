name: Publish NPM (OIDC)

on:
  release:
    types: [published]

permissions:
  id-token: write    # ✅ Necesario para OIDC
  contents: read     # ✅ Permite leer código y metadatos del repo

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]   # ✅ Compatible con npm moderno y Angular

    steps:
      # 1️⃣ Clona el repositorio
      - uses: actions/checkout@v4

      # 2️⃣ Configura Node.js y acceso a npm con OIDC
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'

      # 3️⃣ Actualiza npm a versión >= 11.5.0 (requerido para OIDC)
      # npm@latest (12+) ya no soporta Node 20, por eso se fija la versión 11.
      - name: Update npm to 11.x (OIDC support)
        run: npm install -g npm@11

      # 4️⃣ Verifica configuración OIDC
      - name: Verify npm OIDC setup
        run: |
          echo "🔍 Verificando autenticación OIDC..."
          npm whoami || echo "⚠️ OIDC aún no configurado correctamente."

      # 5️⃣ Instala dependencias y compila la librería
      - run: npm ci
      - run: npm run build
      - run: npm run copy-assets

      # 6️⃣ Instala jq y actualiza la versión en package.json según el release tag
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Update version in package.json
        run: |
          VERSION=$(echo "${{ github.event.release.tag_name }}" | sed 's/^v//')
          jq ".version = \"$VERSION\"" dist/mat-dynamic-form/package.json > temp.json && mv temp.json dist/mat-dynamic-form/package.json
          echo "📦 Versión actualizada a $VERSION"

      # 7️⃣ Publica a npm usando OIDC (sin token)
      - name: Publish to npm using OIDC
        working-directory: dist/mat-dynamic-form
        run: |
          echo "🚀 Publicando con OIDC (Trusted Publisher)..."
          npm publish --provenance --access public

      # 8️⃣ Mensajes finales
      - name: Success message
        if: success()
        run: echo "✅ Publicación completada exitosamente con OIDC."
      - name: Failure message
        if: failure()
        run: echo "❌ La publicación falló. Revisa los logs para más detalles."
