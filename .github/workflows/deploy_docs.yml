# Builds the Docusaurus documentation and publishes it to GitHub Pages
# (https://charlieras262.github.io/DynamicFrom/).

name: Deploy docs

on:
  push:
    branches: [ master ]
    paths:
      - 'projects/mat-dynamic-form-docs/**'
      - '.github/workflows/deploy_docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one but never cancels a deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: projects/mat-dynamic-form-docs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: projects/mat-dynamic-form-docs/package-lock.json

      - uses: actions/configure-pages@v6

      - run: npm ci
      # Fails on broken links (onBrokenLinks: 'throw').
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: projects/mat-dynamic-form-docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
